<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<title>笨豆腐百姓菜馆 · 简历库</title>
<style>
:root{
  --bg:#faf6f1; --card:#fff; --ink:#2d1f14; --ink2:#6b5744; --ink3:#9c8874;
  --line:#ece2d5; --red:#c0392b; --orange:#e67e22;
  --hi:#27ae60; --mid:#f39c12; --low:#e74c3c;
  --tag:#fdf0e3; --tag-ink:#b5651d;
  --sub-bg:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 60px}

/* Header */
header{background:linear-gradient(135deg,#c0392b,#e67e22);color:#fff;border-radius:16px;padding:24px 26px;box-shadow:0 6px 20px rgba(192,57,43,.18)}
header h1{font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px}
header .sub{margin-top:5px;opacity:.92;font-size:13px}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.18);border-radius:10px;padding:9px 14px}
.stat .n{font-size:20px;font-weight:700;line-height:1.1}
.stat .l{font-size:11.5px;opacity:.9;margin-top:2px}

/* Section titles */
.section{margin-top:28px}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-badge{font-size:13px;font-weight:700;color:#fff;padding:5px 14px;border-radius:20px}
.section-badge.sub{background:var(--red)}
.section-badge.match{background:var(--orange)}
.section-title h2{font-size:18px;font-weight:700}
.section-title .count{font-size:13px;color:var(--ink3);margin-left:auto}

/* Filter bar */
.filters{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 10px}
.searchbox{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:var(--card)}
.searchbox:focus{outline:none;border-color:var(--orange)}

/* Card grid */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}

.card{background:var(--card);border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 6px rgba(80,50,20,.05);overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:0 6px 16px rgba(80,50,20,.1)}
.card.submitted{border-left:4px solid var(--red)}
.card.matched{border-left:4px solid var(--orange)}

.card-head{padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:11px}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.avatar.m{background:#5b8db8}.avatar.f{background:#d4778b}
.card-main{flex:1;min-width:0}
.cname{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.pill.hi{background:#e8f8ef;color:var(--hi)}
.pill.mid{background:#fef5e0;color:var(--mid)}
.pill.low{background:#fde8e8;color:var(--low)}
.pill.new{background:#e8f0fe;color:#1a73e8}
.pill.upd{background:#f0f0f0;color:#666}
.pill.sub{background:#fde8e8;color:var(--red)}
.cmeta{font-size:12.5px;color:var(--ink3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.cmeta .phone{color:var(--ink2);font-weight:500}
.job-tag{display:inline-block;font-size:11.5px;background:var(--tag);color:var(--tag-ink);padding:2px 8px;border-radius:4px;font-weight:500;margin-top:5px}
.toggle{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#fdf0e3;color:var(--orange);border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .25s,background .2s}
.card.open .toggle{transform:rotate(180deg);background:var(--red);color:#fff}

.card-body{max-height:0;overflow:hidden;transition:max-height .3s ease;border-top:0 solid var(--line)}
.card.open .card-body{max-height:900px;border-top-width:1px}
.card-body-inner{padding:13px 15px;font-size:13px}
.kv{display:flex;margin-bottom:6px;gap:8px}
.kv .k{color:var(--ink3);flex-shrink:0;width:70px;font-size:12.5px}
.kv .v{flex:1;word-break:break-all;color:var(--ink)}
.work-block{background:#faf6f1;border-radius:8px;padding:8px 11px;margin:6px 0;font-size:12.5px;line-height:1.55}
.work-block .wt{font-weight:600;color:var(--red);margin-bottom:2px}
.reason-box{background:#fdf6ec;border-left:3px solid var(--orange);padding:7px 11px;border-radius:0 8px 8px 0;margin-top:6px;font-size:12.5px;color:var(--ink2)}
.empty{text-align:center;padding:50px 20px;color:var(--ink3)}

footer{margin-top:36px;text-align:center;font-size:12px;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>🍲 笨豆腐百姓菜馆 · 简历库</h1>
  <div class="sub">近2个月（2026-08-13后）新发布或新更新简历 ｜ 数据来源：城市中国平台</div>
  <div class="stats">
    <div class="stat"><div class="n" id="s-sub">0</div><div class="l">已投递简历</div></div>
    <div class="stat"><div class="n" id="s-mat">0</div><div class="l">新匹配简历</div></div>
    <div class="stat"><div class="n" style="color:#a8e6c1" id="s-hi">0</div><div class="l">高匹配</div></div>
    <div class="stat"><div class="n" style="color:#ffe8a8" id="s-mid">0</div><div class="l">中匹配</div></div>
  </div>
</header>

<div class="filters">
  <input type="text" class="searchbox" id="search" placeholder="搜索姓名 / 电话 / 岗位 / 求职意向…">
</div>

<!-- 投递简历区 -->
<div class="section">
  <div class="section-title">
    <span class="section-badge sub">已投递</span>
    <h2>主动投递的简历</h2>
    <span class="count" id="sub-count"></span>
  </div>
  <div class="grid" id="sub-grid"></div>
</div>

<!-- 匹配简历区 -->
<div class="section">
  <div class="section-title">
    <span class="section-badge match">新匹配</span>
    <h2>从简历库新匹配的简历（未投递）</h2>
    <span class="count" id="mat-count"></span>
  </div>
  <div class="grid" id="mat-grid"></div>
</div>

<div class="empty" id="empty" style="display:none">没有符合条件的简历</div>
<footer>点击卡片展开详情 ｜ 导出时间：2026-10-13</footer>
</div>

let kw = '';

document.getElementById('s-sub').textContent = DATA.submitted.length;
document.getElementById('s-mat').textContent = DATA.matched.length;
document.getElementById('s-hi').textContent = DATA.matched.filter(x=>x.level==='高').length;
document.getElementById('s-mid').textContent = DATA.matched.filter(x=>x.level==='中').length;
document.getElementById('sub-count').textContent = '共 ' + DATA.submitted.length + ' 人';
document.getElementById('mat-count').textContent = '共 ' + DATA.matched.length + ' 人';

function avatarChar(name){return name ? name[0] : '?'}
function avatarCls(sex){return sex==='男'?'m':(sex==='女'?'f':'m')}
function shortTime(t){return t ? t.substring(0,16) : '—'}

function matchKw(x){
  if(!kw) return true;
  const s = ((x.name||'')+(x.phone||'')+(x.title||'')+(x.job_name||'')+(x.job_match||'')+(x.wish||'')+(x.reason||'')).toLowerCase();
  return s.includes(kw.toLowerCase());
}

function renderSubmitted(){
  const g = document.getElementById('sub-grid');
  g.innerHTML = '';
  const list = DATA.submitted.filter(matchKw);
  list.forEach(x=>{
    const card = document.createElement('div');
    card.className = 'card submitted';
    const worksHtml = x.works.map((w,i)=>'<div class="work-block"><div class="wt">工作经历 '+(i+1)+'</div>'+esc(w)+'</div>').join('');
    const edusHtml = x.edus.map((w,i)=>'<div class="work-block"><div class="wt">教育经历 '+(i+1)+'</div>'+esc(w)+'</div>').join('');
    const certsHtml = x.certs.length ? '<div class="kv"><span class="k">证书</span><span class="v">'+esc(x.certs.join('；'))+'</span></div>' : '';
    card.innerHTML = `
      <div class="card-head">
        <div class="avatar ${avatarCls(x.sex)}">${avatarChar(x.name)}</div>
        <div class="card-main">
          <div class="cname">
            ${esc(x.name)}
            <span class="pill sub">已投递</span>
          </div>
          <div class="cmeta">
            <span>${esc(x.sex)||'—'} · ${esc(x.age)||'—'}</span>
            <span class="phone">📞 ${esc(x.phone)||'—'}</span>
          </div>
          <div class="cmeta">
            <span>📮 投递：${shortTime(x.sub_time)}</span>
          </div>
          <span class="job-tag">${esc(x.job_name)}</span>
        </div>
        <button class="toggle" title="展开">▼</button>
      </div>
      <div class="card-body"><div class="card-body-inner">
        <div class="kv"><span class="k">期望职位</span><span class="v">${esc(x.wish)||'—'}</span></div>
        <div class="kv"><span class="k">期望薪资</span><span class="v">${esc(x.salary)||'—'}</span></div>
        <div class="kv"><span class="k">学历</span><span class="v">${esc(x.edu)||'—'}</span></div>
        <div class="kv"><span class="k">工作经验</span><span class="v">${esc(x.exp)||'—'}</span></div>
        <div class="kv"><span class="k">求职状态</span><span class="v">${esc(x.status)||'—'}</span></div>
        <div class="kv"><span class="k">居住地</span><span class="v">${esc(x.live)||'—'}</span></div>
        <div class="kv"><span class="k">电话</span><span class="v">${esc(x.phone)||'—'}</span></div>
        <div class="kv"><span class="k">邮箱</span><span class="v">${esc(x.email)||'—'}</span></div>
        ${x.tags ? '<div class="kv"><span class="k">标签</span><span class="v">'+esc(x.tags)+'</span></div>' : ''}
        ${x.self_desc && x.self_desc !== '暂无' ? '<div class="kv"><span class="k">自我介绍</span><span class="v">'+esc(x.self_desc)+'</span></div>' : ''}
        ${worksHtml}
        ${edusHtml}
        ${certsHtml}
      </div></div>`;
    card.querySelector('.card-head').addEventListener('click',()=>card.classList.toggle('open'));
    g.appendChild(card);
  });
}

function renderMatched(){
  const g = document.getElementById('mat-grid');
  g.innerHTML = '';
  const list = DATA.matched.filter(matchKw);
  list.forEach(x=>{
    const card = document.createElement('div');
    card.className = 'card matched';
    card.innerHTML = `
      <div class="card-head">
        <div class="avatar ${avatarCls(x.sex)}">${avatarChar(x.name)}</div>
        <div class="card-main">
          <div class="cname">
            ${esc(x.name)}
            <span class="pill ${x.level==='高'?'hi':x.level==='中'?'mid':'low'}">${x.level}匹配</span>
            <span class="pill ${x.recency==='新发布'?'new':'upd'}">${x.recency}</span>
          </div>
          <div class="cmeta">
            <span>${esc(x.sex)||'—'}${x.age?' · '+esc(x.age):''}</span>
            <span class="phone">📞 ${esc(x.phone)||'—'}</span>
          </div>
          <div class="cmeta"><span>🕐 更新：${shortTime(x.edittime)}</span></div>
          <span class="job-tag">${esc(x.job_match)}</span>
        </div>
        <button class="toggle" title="展开">▼</button>
      </div>
      <div class="card-body"><div class="card-body-inner">
        <div class="kv"><span class="k">求职意向</span><span class="v">${esc(x.title)||'—'}</span></div>
        <div class="kv"><span class="k">创建时间</span><span class="v">${shortTime(x.systime)}</span></div>
        <div class="kv"><span class="k">更新时间</span><span class="v">${shortTime(x.edittime)}</span></div>
        <div class="kv"><span class="k">简历ID</span><span class="v">${esc(x.rid)||'—'}</span></div>
        ${x.email?'<div class="kv"><span class="k">邮箱</span><span class="v">'+esc(x.email)+'</span></div>':''}
        <div class="reason-box">💡 ${esc(x.reason)}</div>
      </div></div>`;
    card.querySelector('.card-head').addEventListener('click',()=>card.classList.toggle('open'));
    g.appendChild(card);
  });
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('search').addEventListener('input',e=>{kw=e.target.value.trim();renderSubmitted();renderMatched();
  const total = DATA.submitted.filter(matchKw).length + DATA.matched.filter(matchKw).length;
  document.getElementById('empty').style.display = total?'none':'block';
});

renderSubmitted();
renderMatched();
</script>
